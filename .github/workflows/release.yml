name: release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-glass-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:release
      - run: npm run lint
      - run: npm test
      # The browser first, then its system packages. On a hosted runner those
      # are a handful of fonts fetched from the Ubuntu mirror; when the mirror is
      # unreachable apt retries for ten minutes and fails the job, so it gets
      # three and the tests run with what the image already has.
      - run: npx playwright install chromium
      - run: timeout 180 npx playwright install-deps chromium || echo "::warning::Playwright system packages were not installed (apt mirror unreachable?)"
      - run: npm run test:browser
      - run: npm run build

      # Installable Monitor theme archive: dist/ sits beside theme.json.
      - run: tar czf theme.tar.gz dist theme.json preview.png
      - run: sha256sum theme.tar.gz | cut -d' ' -f1 | tee theme.tar.gz.sha256

      - name: Resolve release tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish release when version is new
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
            exit 0
          fi

          gh release create "$tag" theme.tar.gz theme.tar.gz.sha256 \
            --target "$GITHUB_SHA" \
            --notes-file RELEASE_NOTES.md \
            --title "Monitor Glass $tag" \
            --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
